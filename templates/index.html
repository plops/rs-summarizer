<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rs-summarizer</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>YouTube Transcript Summarizer</h1>
        <form hx-post="/process_transcript" hx-target="#result" hx-swap="innerHTML">
            <label for="url">YouTube URL</label>
            <input type="text" id="url" name="original_source_link" placeholder="https://www.youtube.com/watch?v=...">
            
            <details>
                <summary>Or paste a transcript directly...</summary>
                <label for="transcript">Transcript Text</label>
                <textarea id="transcript" name="transcript" rows="6" placeholder="00:00:00 Welcome to this video...&#10;00:00:05 Today we will learn about ownership..."></textarea>
                <small>If you paste a transcript here, the YouTube URL becomes optional and will only be used to generate links for the timestamps.</small>
            </details>

            <label for="model">Model</label>
            <select id="model" name="model">
                {% for model in models %}
                <option value="{{ model.name }}" data-architecture="{{ model.architecture.as_str() }}">{{ model.name }}</option>
                {% endfor %}
            </select>

            <fieldset id="extra-options" style="margin-top: 1rem; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 8px; padding: 1rem; background: rgba(0, 0, 0, 0.01); display: none;">
                <legend style="padding: 0 0.5rem; font-weight: bold; font-size: 0.9rem;">Model Options</legend>
                
                <div id="grounding-container" style="display: none; margin-bottom: 0.5rem;">
                    <label for="google_search_grounding">
                        <input type="checkbox" id="google_search_grounding" name="google_search_grounding" role="switch">
                        Grounding with Google Search
                    </label>
                </div>

                <div id="url-context-container" style="display: none; margin-bottom: 0.5rem;">
                    <label for="url_context">
                        <input type="checkbox" id="url_context" name="url_context" role="switch">
                        URL Context (Gemini only)
                    </label>
                </div>
            </fieldset>
            
            <button type="submit" style="margin-top: 1.5rem;">Summarize</button>
        </form>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const urlInput = document.getElementById('url');
                const transcriptInput = document.getElementById('transcript');

                function updateRequired() {
                    if (transcriptInput.value.trim().length > 0) {
                        urlInput.removeAttribute('required');
                    } else {
                        urlInput.setAttribute('required', 'required');
                    }
                }

                transcriptInput.addEventListener('input', updateRequired);
                updateRequired();

                // Toggle visibility of Grounding and URL Context options
                const modelSelect = document.getElementById('model');
                const extraOptions = document.getElementById('extra-options');
                const groundingContainer = document.getElementById('grounding-container');
                const urlContextContainer = document.getElementById('url-context-container');
                const groundingCheckbox = document.getElementById('google_search_grounding');
                const urlContextCheckbox = document.getElementById('url_context');

                function updateOptionsVisibility() {
                    const selectedOption = modelSelect.options[modelSelect.selectedIndex];
                    const arch = selectedOption ? selectedOption.getAttribute('data-architecture') : '';

                    let showGrounding = false;
                    let showUrlContext = false;

                    if (arch === 'Gemini') {
                        showGrounding = true;
                        showUrlContext = true;
                    } else if (arch === 'Gemma') {
                        showGrounding = true;
                        showUrlContext = false;
                        urlContextCheckbox.checked = false;
                    } else {
                        showGrounding = false;
                        showUrlContext = false;
                        groundingCheckbox.checked = false;
                        urlContextCheckbox.checked = false;
                    }

                    groundingContainer.style.display = showGrounding ? 'block' : 'none';
                    urlContextContainer.style.display = showUrlContext ? 'block' : 'none';
                    extraOptions.style.display = (showGrounding || showUrlContext) ? 'block' : 'none';
                }

                modelSelect.addEventListener('change', updateOptionsVisibility);
                updateOptionsVisibility();
            });
        </script>
        
        <div id="result"></div>
        
        <hr>
        <nav>
            <a href="/browse">Browse Summaries</a> |
            <form hx-post="/search" hx-target="#search-results" hx-swap="innerHTML" style="display:inline">
                <input type="text" name="query" placeholder="Search summaries..." style="display:inline;width:auto">
                <button type="submit">Search</button>
            </form>
        </nav>
        <div id="search-results"></div>
    </main>
</body>
</html>
